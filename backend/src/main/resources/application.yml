# QTKHCN backend — cấu hình dev local (Mốc 2). Trỏ vào stack Camunda + Postgres của Mốc 1
# (infra/README.md) — chỉnh lại port/credential nếu bạn đổi khác mặc định ở đó.

spring:
  application:
    name: qtkhcn-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/qtkhcn
    username: qtkhcn
    password: qtkhcn-dev-local
  jpa:
    hibernate:
      # Flyway là nguồn chuẩn cho schema (db/migration) — Hibernate CHỈ validate, không tự sinh
      # DDL, tránh 2 nguồn sự thật về schema.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  # Dev services are consumed locally or through the loopback-only Caddy tunnel proxy.
  address: 127.0.0.1
  port: 8090

# Camunda 8 Java SDK (camunda-spring-boot-starter, D14) — trỏ vào container `orchestration` của
# Mốc 1 (infra/README.md). ⚠️ Property path (`camunda.client.*`) CHƯA xác nhận chạy được — xác nhận
# lại đúng key khi có Maven/JDK; tài liệu chính thức tại thời điểm dùng có thể đổi tên khoá.
camunda:
  client:
    mode: self-managed
    grpc-address: http://localhost:26500
    rest-address: http://localhost:8080

# Dev API key stub (security/DevApiKeyFilter.java) — đổi giá trị này khi chạy ngoài máy dev cá nhân,
# và thay hẳn bằng OIDC/SAML thật khi OQ-021 chốt.
qtkhcn:
  dev-api-key: dev-local-only
  cors:
    # Comma-separated exact origins. Demo sessions add their current HTTPS Runlocal origin through
    # QTKHCN_CORS_ALLOWED_ORIGINS; do not use a wildcard because these APIs can mutate demo data.
    allowed-origins: ${QTKHCN_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  process-import:
    max-file-size-bytes: 5242880
  bpmn-test:
    # Fail-closed by default. Enable only with the dedicated engine from
    # infra/camunda/docker-compose.bpmn-test.yml; never point these at production Camunda.
    enabled: true
    grpc-address: http://localhost:26510
    rest-address: http://localhost:8092
    default-ttl-seconds: 900
    max-ttl-seconds: 3600
    expiry-scan-ms: 30000

logging:
  level:
    vn.vht.qtkhcn: DEBUG
