<div class="fdl-wrap">
  @if (comp().label) {
    <div class="fdl-label">
      {{ comp().label }}
      @if (required()) { <span class="fdl-required">*</span> }
    </div>
  }

  @for (view of rowViews(); track view.index) {
    <div class="fdl-row">
      <button nz-button nzType="text" nzDanger nzSize="small" class="fdl-remove" (click)="removeRow(view.index)" aria-label="Xoá dòng">
        <span nz-icon nzType="delete"></span>
      </button>
      @for (child of children(); track $index) {
        @if (!view.hidden.has(child.id ?? child.key ?? '')) {
          <app-form-field
            [comp]="child"
            [value]="fieldValue(view, child)"
            [error]="fieldError(view, child)"
            [valueSources]="valueSources()"
            [disabled]="isComputed(child) || child.readonly === true"
            (valueChange)="child.key && updateCell(view.index, child.key, $event)"
          ></app-form-field>
        }
      }
    </div>
  }

  <button nz-button nzType="dashed" nzBlock (click)="addRow()">
    <span nz-icon nzType="plus"></span>
    Thêm dòng
  </button>

  @if (listError()) {
    <div class="fdl-error">{{ listError() }}</div>
  }
</div>
