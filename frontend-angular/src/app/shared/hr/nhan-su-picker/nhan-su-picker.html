<nz-modal
  [nzVisible]="visible()"
  nzTitle="Chọn nhân sự"
  [nzWidth]="880"
  [nzFooter]="footer"
  (nzOnCancel)="huy.emit()"
>
  <div *nzModalContent class="hr-picker">
    <aside class="hr-picker__tree">
      <div class="hr-picker__treehead">Đơn vị</div>
      <button type="button" class="hr-picker__node" [class.is-active]="donViDangChon() === null" (click)="chonDonVi(null)">
        <nz-icon nzType="apartment" /> Tất cả đơn vị
      </button>
      @for (donVi of donViList; track donVi) {
        <button
          type="button"
          class="hr-picker__node hr-picker__node--child"
          [class.is-active]="donViDangChon() === donVi"
          (click)="chonDonVi(donVi)"
        >
          {{ donVi }}
        </button>
      }
    </aside>

    <div class="hr-picker__main">
      <nz-input-group nzPrefixIcon="search">
        <input nz-input placeholder="Tìm theo mã, họ tên, email..." [ngModel]="tuKhoa()" (ngModelChange)="tuKhoa.set($event)" />
      </nz-input-group>

      <div class="hr-picker__tablewrap">
        <table class="hr-picker__table">
          <thead>
            <tr>
              <th class="hr-picker__pick"></th>
              <th>Mã NV</th>
              <th>Họ tên</th>
              <th>Đơn vị</th>
              <th>Chức danh</th>
            </tr>
          </thead>
          <tbody>
            @for (u of ungVien(); track u.maNhanVien) {
              <tr [class.is-locked]="bicKhoa(u.maNhanVien)" (click)="toggle(u.maNhanVien)">
                <td class="hr-picker__pick">
                  @if (nhieu()) {
                    <label nz-checkbox [ngModel]="daTich(u.maNhanVien)" [nzDisabled]="bicKhoa(u.maNhanVien)"></label>
                  } @else {
                    <label nz-radio [ngModel]="daTich(u.maNhanVien)" [nzDisabled]="bicKhoa(u.maNhanVien)"></label>
                  }
                </td>
                <td><code>{{ u.maNhanVien }}</code></td>
                <td>
                  {{ u.hoTen }}
                  @if (bicKhoa(u.maNhanVien)) { <small class="hr-picker__note">đã có trong đề tài</small> }
                </td>
                <td>{{ u.donVi }}</td>
                <td>{{ u.chucDanh }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5"><nz-empty nzNotFoundContent="Không có nhân sự khớp điều kiện lọc." /></td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</nz-modal>

<ng-template #footer>
  <button nz-button type="button" (click)="huy.emit()">Huỷ</button>
  <button nz-button nzType="primary" type="button" [disabled]="soDaChon() === 0" (click)="xacNhanChon()">
    Chọn ({{ soDaChon() }})
  </button>
</ng-template>
