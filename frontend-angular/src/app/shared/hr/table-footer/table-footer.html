<div class="hr-tf">
  <div class="hr-tf__left">
    <span>Hiển thị bản ghi/trang:</span>
    <nz-select
      class="hr-tf__size"
      [ngModel]="pageSize()"
      (ngModelChange)="doiKichThuoc($event)"
      nzSize="small"
    >
      @for (size of pageSizeOptions(); track size) {
        <nz-option [nzValue]="size" [nzLabel]="size + ''" />
      }
    </nz-select>
  </div>

  <div class="hr-tf__right">
    <span class="hr-tf__total">Tổng số bản ghi: <strong>{{ total() }}</strong></span>
    <nav class="hr-tf__pager" aria-label="Phân trang">
      <button type="button" [disabled]="pageIndex() === 1" (click)="doiTrang(1)" aria-label="Trang đầu">«</button>
      <button type="button" [disabled]="pageIndex() === 1" (click)="doiTrang(pageIndex() - 1)" aria-label="Trang trước">‹</button>
      @for (page of cacTrang(); track $index) {
        @if (laSo(page)) {
          <button type="button" [class.is-active]="page === pageIndex()" (click)="doiTrang(page)">{{ page }}</button>
        } @else {
          <span class="hr-tf__gap">…</span>
        }
      }
      <button type="button" [disabled]="pageIndex() >= soTrang()" (click)="doiTrang(pageIndex() + 1)" aria-label="Trang sau">›</button>
      <button type="button" [disabled]="pageIndex() >= soTrang()" (click)="doiTrang(soTrang())" aria-label="Trang cuối">»</button>
    </nav>
  </div>
</div>
