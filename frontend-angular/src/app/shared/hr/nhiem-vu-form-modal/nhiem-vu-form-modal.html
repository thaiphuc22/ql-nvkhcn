<cmm-dialog
  [visible]="visible()"
  (visibleChange)="!$event && huy.emit()"
  [header]="nhiemVu() ? 'Sửa nhiệm vụ' : 'Khai báo nhiệm vụ'"
  [modal]="true"
  [style]="{ width: '720px' }"
>
  <div class="hr-form">
    @if (loi().length) {
      <ul class="hr-form__errors">
        @for (m of loi(); track m) {
          <li>{{ m }}</li>
        }
      </ul>
    }

    <div class="hr-form__row">
      <label class="hr-field">
        <span>Mã nhiệm vụ <b>*</b></span>
        <input
          cmmInputText
          type="text"
          [value]="form().maNhiemVu"
          (input)="capNhat('maNhiemVu', $any($event.target).value)"
          [disabled]="!!nhiemVu()"
        />
      </label>
      <label class="hr-field">
        <span>Tình trạng phân bổ</span>
        <cmm-select
          [value]="form().tinhTrangPhanBo"
          (valueChange)="capNhat('tinhTrangPhanBo', $event)"
          [props]="{ options: tinhTrangOptions, optionValue: 'value', optionLabel: 'label' }"
        />
      </label>
    </div>

    <label class="hr-field">
      <span>Tên nhiệm vụ <b>*</b></span>
      <input
        cmmInputText
        type="text"
        [value]="form().tenNhiemVu"
        (input)="capNhat('tenNhiemVu', $any($event.target).value)"
      />
    </label>

    <div class="hr-form__row">
      <label class="hr-field">
        <span>Phân loại <b>*</b></span>
        <cmm-select
          [value]="form().phanLoai"
          (valueChange)="capNhat('phanLoai', $event)"
          [props]="{ options: phanLoaiOptions, optionValue: 'value', optionLabel: 'label' }"
        />
      </label>
      <label class="hr-field">
        <span>Phân nguồn <b>*</b></span>
        <cmm-select
          [value]="form().phanNguon"
          (valueChange)="doiNguon($event)"
          [props]="{ options: phanNguonOptions, optionValue: 'value', optionLabel: 'label' }"
        />
      </label>
    </div>

    <!-- Chỉ nhiệm vụ nguồn KHCN mới thuộc một đề tài — xem ghi chú ở nhiem-vu-form-modal.ts. -->
    @if (laNguonKHCN()) {
      <div class="hr-form__row">
        <label class="hr-field">
          <span>Mã đề tài</span>
          <input
            cmmInputText
            type="text"
            placeholder="VD: 011-24-TĐ-RDP-QS"
            [value]="form().maDeTai ?? ''"
            (input)="capNhat('maDeTai', $any($event.target).value)"
          />
        </label>
        <label class="hr-field">
          <span>Tên đề tài</span>
          <input
            cmmInputText
            type="text"
            [value]="form().tenDeTai ?? ''"
            (input)="capNhat('tenDeTai', $any($event.target).value)"
          />
        </label>
      </div>
    }

    <div class="hr-form__row">
      <label class="hr-field">
        <span>Khối (đơn vị cấp 4) <b>*</b></span>
        <cmm-select
          [value]="form().khoi"
          (valueChange)="doiKhoi($event)"
          [props]="{
            options: khoiOptions,
            optionValue: 'value',
            optionLabel: 'label',
            placeholder: 'Chọn khối',
          }"
        />
      </label>
      <label class="hr-field">
        <span>Đơn vị chủ trì <b>*</b></span>
        <cmm-select
          [value]="form().donViChuTri"
          (valueChange)="doiDonViChuTri($event)"
          [props]="{
            options: donViOptions(),
            optionValue: 'value',
            optionLabel: 'label',
            placeholder: 'Chọn đơn vị cấp 5',
            filter: true,
            disabled: !form().khoi,
          }"
        />
      </label>
    </div>

    <label class="hr-field">
      <span>Đơn vị phân bổ <b>*</b></span>
      <cmm-multiselect
        [value]="form().donViPhanBo"
        (valueChange)="capNhat('donViPhanBo', $event)"
        [props]="{
          options: donViOptions(),
          optionValue: 'value',
          optionLabel: 'label',
          placeholder: 'Các đơn vị cùng phân bổ nhân công',
          filter: true,
          disabled: !form().khoi,
        }"
      />
    </label>

    <div class="hr-form__row">
      <label class="hr-field">
        <span>PM — Chủ nhiệm nhiệm vụ <b>*</b></span>
        <cmm-select
          [value]="form().pmMaNhanVien"
          (valueChange)="capNhat('pmMaNhanVien', $event)"
          [props]="{
            options: nhanSuOptions,
            optionValue: 'value',
            optionLabel: 'label',
            placeholder: 'Chọn PM',
            filter: true,
          }"
        />
      </label>
      <label class="hr-field">
        <span>PA — Trợ lý đơn vị chủ trì <b>*</b></span>
        <cmm-select
          [value]="form().paMaNhanVien"
          (valueChange)="capNhat('paMaNhanVien', $event)"
          [props]="{
            options: nhanSuOptions,
            optionValue: 'value',
            optionLabel: 'label',
            placeholder: 'Chọn PA',
            filter: true,
          }"
        />
      </label>
    </div>

    <div class="hr-form__row">
      <label class="hr-field">
        <span>Tổng dự toán (đồng) <b>*</b></span>
        <cmm-inputnumber
          styleClass="hr-field__full"
          [value]="form().tongDuToan"
          (valueChange)="capNhat('tongDuToan', $event ?? 0)"
          [min]="0"
          [step]="1000000"
        />
      </label>
      <label class="hr-field">
        <span>CPNC được phê duyệt (đồng) <b>*</b></span>
        <cmm-inputnumber
          styleClass="hr-field__full"
          [value]="form().chiPhiNhanCongPheDuyet"
          (valueChange)="capNhat('chiPhiNhanCongPheDuyet', $event ?? 0)"
          [min]="0"
          [step]="1000000"
          [disabled]="laBaoHanh()"
        />
        @if (laBaoHanh()) {
          <small class="hr-muted"
            >Nguồn Bảo hành chỉ theo dõi số đã phân bổ, không lập dự toán.</small
          >
        }
      </label>
    </div>

    <div class="hr-form__row">
      <label class="hr-field">
        <span>Dự phòng (đồng)</span>
        <cmm-inputnumber
          styleClass="hr-field__full"
          [value]="form().duPhong"
          (valueChange)="capNhat('duPhong', $event ?? 0)"
          [min]="0"
          [step]="1000000"
          [disabled]="laBaoHanh()"
        />
        <small class="hr-muted">Nguồn đã lập dự toán = CPNC phê duyệt + dự phòng.</small>
      </label>
      <div class="hr-field">
        <span>Thời gian thực hiện <b>*</b></span>
        <div class="hr-form__row">
          <!-- `p-datepicker` chứ không phải `cmm-datepicker`: thư viện không xuất component đó ra
               ngoài — xem `core/utils/hr-date.ts`. -->
          <p-datepicker
            [ngModel]="ngayDate('tuNgay')"
            (ngModelChange)="doiNgay('tuNgay', $event)"
            [dateFormat]="dateFormat"
            [showIcon]="true"
            [fluid]="true"
            placeholder="dd/mm/yyyy"
          />
          <p-datepicker
            [ngModel]="ngayDate('denNgay')"
            (ngModelChange)="doiNgay('denNgay', $event)"
            [dateFormat]="dateFormat"
            [showIcon]="true"
            [fluid]="true"
            placeholder="dd/mm/yyyy"
          />
        </div>
      </div>
    </div>

    <label class="hr-field">
      <span>Mô tả</span>
      <textarea
        cmmTextarea
        rows="3"
        [value]="form().moTa"
        (input)="capNhat('moTa', $any($event.target).value)"
      ></textarea>
    </label>
  </div>

  <ng-template #footer>
    <cmm-button
      label="Huỷ"
      [outlined]="true"
      severity="secondary"
      type="button"
      (onClick)="huy.emit()"
    />
    <cmm-button label="Lưu" type="button" (onClick)="xacNhan()" />
  </ng-template>
</cmm-dialog>
