<!-- Template ô có cấu trúc — khai TRƯỚC `<ubck-table>`: `columns()` đọc chúng bằng
     `viewChild.required`, đặt sau bảng thì lần dựng view đầu ném NG0951. -->
<ng-template #tplThaoTac let-row="rowData">
  <div class="hr-actions">
    @if (row.disabled) {
      <!-- Bản khai đã gửi thì không sửa được nữa. Bỏ hẳn icon thay vì để icon mờ: cột Thao tác chỉ
           rộng 110px, một icon "bấm được nhưng không làm gì" là mời người dùng bấm nhầm. -->
      <span class="hr-actions__trong" aria-hidden="true"></span>
    } @else {
      <cmm-icon-edit (eventClick)="moSua(row.nhiemVu)" title="Sửa bản khai" />
      <span class="hr-actions__sep" aria-hidden="true"></span>
    }
    <cmm-icon-eye (eventClick)="moChiTiet(row.nhiemVu)" title="Xem chi tiết" />
  </div>
</ng-template>

<ng-template #tplMa let-ma let-row="rowData">
  <a class="hr-code" (click)="moChiTiet(row.nhiemVu)">{{ ma }}</a>
</ng-template>

<ng-template #tplTrangThai let-tt>
  <hr-trang-thai-tag [nhan]="nhanTrangThai(tt)" [loai]="mauTrangThai(tt)" />
</ng-template>

<hr-page-card tieuDe="Khai báo nhiệm vụ" moTa="Bản khai nhiệm vụ của bạn và của đơn vị.">
  <div actions>
    <cmm-button
      label="Trình duyệt ({{ soDaChon() }})"
      icon="pi pi-send"
      [outlined]="true"
      severity="secondary"
      type="button"
      [disabled]="soDaChon() === 0"
      (onClick)="trinhDuyetHangLoat()"
    />
    <cmm-button label="Khai báo nhiệm vụ" icon="pi pi-plus" type="button" (onClick)="moKhaiBao()" />
  </div>

  <!-- Khối tìm kiếm nâng cao nằm TRONG card này, ngay trên bảng (D23, `screens/06`). -->
  <hr-advanced-search (lamMoi)="lamMoi()" (timKiem)="timKiem()">
    <label class="hr-field">
      <span>Từ khoá</span>
      <input
        cmmInputText
        type="text"
        placeholder="Mã, tên nhiệm vụ, mã đề tài"
        [value]="locNhap().tuKhoa"
        (input)="capNhatLoc('tuKhoa', $any($event.target).value)"
      />
    </label>
    <label class="hr-field">
      <span>Phân loại</span>
      <cmm-select
        [value]="locNhap().phanLoai"
        (valueChange)="capNhatLoc('phanLoai', $event)"
        [props]="{
          options: phanLoaiOptions,
          optionValue: 'value',
          optionLabel: 'label',
          placeholder: 'Tất cả',
          showClear: true,
        }"
      />
    </label>
    <label class="hr-field">
      <span>Khối</span>
      <cmm-select
        [value]="locNhap().khoi"
        (valueChange)="capNhatLoc('khoi', $event)"
        [props]="{
          options: khoiOptions,
          optionValue: 'value',
          optionLabel: 'label',
          placeholder: 'Tất cả',
          showClear: true,
        }"
      />
    </label>
    <label class="hr-field">
      <span>Trạng thái</span>
      <cmm-select
        [value]="locNhap().trangThai"
        (valueChange)="capNhatLoc('trangThai', $event)"
        [props]="{
          options: trangThaiOptions,
          optionValue: 'value',
          optionLabel: 'label',
          placeholder: 'Tất cả',
          showClear: true,
        }"
      />
    </label>
    <label class="hr-field">
      <span>Năm bắt đầu</span>
      <!-- `useGrouping = false`: năm là MÃ, không phải số lượng — để mặc định thì 2026 hiện ra
           "2.026". Đây là lỗi hay gặp nhất khi đổi ô nhập số sang PrimeNG. -->
      <cmm-inputnumber
        [value]="locNhap().namBatDau"
        (valueChange)="capNhatLoc('namBatDau', $event ?? null)"
        [min]="2000"
        [max]="2100"
        [useGrouping]="false"
        placeholder="Tất cả"
        styleClass="hr-field__full"
      />
    </label>
  </hr-advanced-search>

  <div class="hr-filters">
    <cmm-selectbutton
      class="hr-filters__spacer"
      [value]="phamVi()"
      (valueChange)="doiPhamVi($event)"
      [options]="phamViOptions"
      optionValue="value"
      optionLabel="label"
    />
  </div>

  <ubck-table
    [columns]="columns()"
    [dataSources]="pagedRows()"
    [props]="tableProps"
    [selection]="chonDong()"
    (selectionChange)="chonDong.set($event)"
  />

  <ubck-paginator [props]="paginatorProps()" (onPageChange)="doiTrang($event)" />
</hr-page-card>

<hr-nhiem-vu-form-modal
  [visible]="modalMo()"
  [nhiemVu]="dangSua()"
  (huy)="modalMo.set(false)"
  (luu)="luu($event)"
/>
