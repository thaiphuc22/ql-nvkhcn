<!--
  Template cho các ô có cấu trúc — khai TRƯỚC `<ubck-table>` một cách CỐ Ý.

  `columns()` đọc chúng qua `viewChild.required`, mà truy vấn kiểu signal chỉ trả về kết quả khi
  node đã được tạo. Đặt các `<ng-template>` này xuống dưới bảng thì lần dựng view đầu tiên bảng đọc
  phải truy vấn chưa có giá trị và Angular ném NG0951 — trang trắng, thông báo lỗi chẳng liên quan
  gì tới bảng. Thứ tự ở đây là một ràng buộc, không phải sở thích trình bày.

  Ngữ cảnh do `UbckTable` truyền vào là `{ $implicit: rowData[col.field], rowData, col }` ⇒
  `let-row="rowData"` là cả bản ghi, còn biến ngầm định là GIÁ TRỊ của riêng ô đó.
  `row.nhiemVu` là bản ghi `NhiemVu` gốc (xem `pagedRows`).
-->
<ng-template #tplThaoTac let-row="rowData">
  <div class="hr-actions">
    <cmm-icon-edit (eventClick)="moSua(row.nhiemVu)" title="Sửa nhiệm vụ" />
    <span class="hr-actions__sep" aria-hidden="true"></span>
    <cmm-icon-delete (eventClick)="moXoa(row.nhiemVu)" title="Xoá nhiệm vụ" />
    @if (row.trangThai === 'CHO_DUYET') {
      <span class="hr-actions__sep" aria-hidden="true"></span>
      <cmm-button
        icon="pi pi-check"
        [text]="true"
        severity="success"
        type="button"
        ariaLabel="Duyệt bản khai"
        (onClick)="duyet(row.nhiemVu)"
      />
      <cmm-button
        icon="pi pi-ban"
        [text]="true"
        severity="danger"
        type="button"
        ariaLabel="Từ chối bản khai"
        (onClick)="moTuChoi(row.nhiemVu)"
      />
    }
  </div>
</ng-template>

<ng-template #tplMa let-ma let-row="rowData">
  <a class="hr-code" (click)="moChiTiet(row.nhiemVu)">{{ ma }}</a>
</ng-template>

<ng-template #tplTinhTrang let-tt>
  <hr-trang-thai-tag [nhan]="nhanTinhTrang(tt)" [loai]="mauTinhTrang(tt)" />
</ng-template>

<ng-template #tplTrangThai let-tt>
  <hr-trang-thai-tag [nhan]="nhanTrangThai(tt)" [loai]="mauTrangThai(tt)" />
</ng-template>

<hr-page-card
  tieuDe="Danh mục nhiệm vụ"
  moTa="Toàn bộ nhiệm vụ/dự án đang theo dõi chi phí nhân công (BM5)."
>
  <div actions>
    <cmm-button label="Thêm mới" icon="pi pi-plus" type="button" (onClick)="moThemMoi()" />
  </div>

  <!-- Hàng lọc CĂN PHẢI trong card, đúng bản thiết kế (không phải căn trái như các màn cũ). -->
  <div class="hr-filters">
    <cmm-select
      class="hr-filters__select"
      [value]="khoiFilter()"
      (valueChange)="locKhoi($event)"
      [props]="{
        options: khoiOptions,
        optionValue: 'value',
        optionLabel: 'label',
        placeholder: 'Khối',
        showClear: true,
      }"
    />
    <cmm-select
      class="hr-filters__select"
      [value]="phanLoaiFilter()"
      (valueChange)="locPhanLoai($event)"
      [props]="{
        options: phanLoaiOptions,
        optionValue: 'value',
        optionLabel: 'label',
        placeholder: 'Phân loại',
        showClear: true,
      }"
    />
    <cmm-select
      class="hr-filters__select"
      [value]="trangThaiFilter()"
      (valueChange)="locTrangThai($event)"
      [props]="{
        options: trangThaiOptions,
        optionValue: 'value',
        optionLabel: 'label',
        placeholder: 'Trạng thái',
        showClear: true,
      }"
    />
    <span class="hr-search">
      <i class="pi pi-search hr-search__icon"></i>
      <input
        cmmInputText
        type="text"
        placeholder="Tìm theo mã, tên, mã đề tài..."
        [value]="tuKhoa()"
        (input)="timKiem($any($event.target).value)"
      />
    </span>
  </div>

  <ubck-table [columns]="columns()" [dataSources]="pagedRows()" [props]="tableProps" />

  <ubck-paginator [props]="paginatorProps()" (onPageChange)="doiTrang($event)" />
</hr-page-card>

<hr-nhiem-vu-form-modal
  [visible]="modalMo()"
  [nhiemVu]="dangSua()"
  (huy)="modalMo.set(false)"
  (luu)="luu($event)"
/>

<!-- Hộp xác nhận xoá: nêu RÕ TÊN bản ghi. Không dựa vào màu để báo "đây là hành động phá huỷ" —
     ramp brand và danger của design system trùng nhau nên nút chính và nút xoá cùng đỏ. -->
<cmm-dialog
  [visible]="xoaMo()"
  (visibleChange)="xoaMo.set($event)"
  header="Xoá nhiệm vụ"
  [modal]="true"
  [style]="{ width: '400px' }"
>
  <p class="hr-confirm">
    Xoá nhiệm vụ <strong>{{ xoaTarget()?.maNhiemVu }}</strong> — {{ xoaTarget()?.tenNhiemVu }}? Thao
    tác này không hoàn tác được.
  </p>
  <ng-template #footer>
    <cmm-button
      label="Huỷ"
      [outlined]="true"
      severity="secondary"
      type="button"
      (onClick)="xoaMo.set(false)"
    />
    <cmm-button label="Xoá" severity="danger" type="button" (onClick)="xacNhanXoa()" />
  </ng-template>
</cmm-dialog>

<cmm-dialog
  [visible]="tuChoiMo()"
  (visibleChange)="tuChoiMo.set($event)"
  header="Từ chối bản khai"
  [modal]="true"
  [style]="{ width: '520px' }"
>
  <label class="hr-field">
    <span>Lý do từ chối <b>*</b></span>
    <textarea
      cmmTextarea
      rows="3"
      placeholder="Nêu rõ điểm cần sửa để người khai biết phải làm gì."
      [value]="tuChoiLyDo()"
      (input)="tuChoiLyDo.set($any($event.target).value)"
    ></textarea>
  </label>
  <ng-template #footer>
    <cmm-button
      label="Huỷ"
      [outlined]="true"
      severity="secondary"
      type="button"
      (onClick)="tuChoiMo.set(false)"
    />
    <cmm-button
      label="Từ chối"
      severity="danger"
      type="button"
      [disabled]="!tuChoiLyDo().trim()"
      (onClick)="xacNhanTuChoi()"
    />
  </ng-template>
</cmm-dialog>
