name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "npm ci attempt $attempt"
            rm -rf node_modules
            timeout 240 npm ci --no-audit --no-fund
            status=$?
            if [ $status -eq 0 ] && npm ls --depth=0 >/dev/null 2>&1; then
              echo "npm ci succeeded and verified complete on attempt $attempt"
              exit 0
            fi
            echo "::warning::npm ci attempt $attempt failed or left node_modules incomplete (exit $status), retrying"
          done
          echo "::error::npm ci did not produce a complete node_modules after 4 attempts"
          exit 1

      - name: Build application
        working-directory: webapp
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
