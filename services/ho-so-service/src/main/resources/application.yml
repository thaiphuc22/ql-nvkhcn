spring:
  application:
    name: qtkhcn-ho-so-service
  datasource:
    url: ${QTKHCN_HO_SO_DB_URL:jdbc:postgresql://localhost:5432/qtkhcn_ho_so}
    username: ${QTKHCN_HO_SO_DB_USERNAME:qtkhcn}
    password: ${QTKHCN_HO_SO_DB_PASSWORD:qtkhcn-dev-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1
  port: ${QTKHCN_HO_SO_PORT:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

qtkhcn:
  internal:
    service-token: ${QTKHCN_HO_SO_SERVICE_TOKEN:}

logging:
  level:
    vn.vht.qtkhcn.hoso: INFO
