spring:
  application:
    name: qtkhcn-ho-so-service
  datasource:
    url: ${QTKHCN_HO_SO_DB_URL:jdbc:postgresql://localhost:5432/qtkhcn_ho_so}
    username: ${QTKHCN_HO_SO_DB_USERNAME:qtkhcn}
    password: ${QTKHCN_HO_SO_DB_PASSWORD:qtkhcn-dev-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${QTKHCN_DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${QTKHCN_DOCUMENT_MAX_REQUEST_SIZE:21MB}

server:
  address: 127.0.0.1
  port: ${QTKHCN_HO_SO_PORT:8093}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

qtkhcn:
  documents:
    storage-path: ${QTKHCN_DOCUMENT_STORAGE_PATH:./data/ho-so-files}
  ai:
    attachments:
      max-files: ${QTKHCN_AI_ATTACHMENT_MAX_FILES:5}
      max-chars-per-file: ${QTKHCN_AI_ATTACHMENT_MAX_CHARS_PER_FILE:4000}
      max-chars-total: ${QTKHCN_AI_ATTACHMENT_MAX_CHARS_TOTAL:8000}
  internal:
    service-token: ${QTKHCN_HO_SO_SERVICE_TOKEN:}
  workflow:
    base-url: ${QTKHCN_WORKFLOW_BASE_URL:http://127.0.0.1:8090}
    service-token: ${QTKHCN_WORKFLOW_SERVICE_TOKEN:}
    projection-reconcile-ms: ${QTKHCN_WORKFLOW_PROJECTION_RECONCILE_MS:5000}
  identity:
    base-url: ${QTKHCN_IDENTITY_BASE_URL:http://127.0.0.1:8095}
    service-token: ${QTKHCN_IDENTITY_SERVICE_TOKEN:}
  outbox:
    dispatch-ms: ${QTKHCN_OUTBOX_DISPATCH_MS:1000}

logging:
  level:
    vn.vht.qtkhcn.hoso: INFO
