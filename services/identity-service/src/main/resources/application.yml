spring:
  application:
    name: qtkhcn-identity-service
  datasource:
    url: ${QTKHCN_IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/qtkhcn_identity}
    username: ${QTKHCN_IDENTITY_DB_USERNAME:qtkhcn}
    password: ${QTKHCN_IDENTITY_DB_PASSWORD:qtkhcn-dev-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  address: 127.0.0.1
  port: ${QTKHCN_IDENTITY_PORT:8095}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
qtkhcn:
  dev-api-key: dev-local-only
  internal:
    service-token: ${QTKHCN_IDENTITY_SERVICE_TOKEN:}
